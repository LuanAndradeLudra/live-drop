<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <script>
      (function () {
        if (new URLSearchParams(location.search).has("overlay")) {
          document.documentElement.classList.add("overlay");
        }
      })();
    </script>
    <meta charset="utf-8" />
    <title>Live Drop – Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
        font-family: "Roboto Condensed", sans-serif;
        font-weight: 400;
      }
      a {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: white;
      }
      .live-drop {
        width: 100%;
        display: flex;
        align-items: center;
        overflow: auto;
        scrollbar-gutter: stable;
        background-color: #070a18;
      }
      .live-drop::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .live-drop::-webkit-scrollbar-track {
        background: #222;
      }

      .live-drop::-webkit-scrollbar-thumb {
        background: #fb5d09;
        border-radius: 4px;
      }

      .live-drop::-webkit-scrollbar-thumb:hover {
        background: #eb7434;
      }

      .live-drop::-webkit-scrollbar-corner {
        background: #222;
      }

      .live-drop {
        scrollbar-width: thin;
        scrollbar-color: #fb5d09 #222;
      }
      .live-drop .streammer {
        padding: 15px;
      }

      .streammer .logo {
        width: 75px;
      }

      .drops-area {
        display: flex;
        gap: 15px;
        padding: 15px;
      }

      .drops-area.hide-background {
        background: none !important;
      }

      .drop {
        width: 300px;
        color: white;
        display: flex;
        flex-direction: column;
        padding: 6px 0;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }

      .drop-restricted {
        background: linear-gradient(0deg, #8000e2, #0000);
        border: 2px solid #d8a8fd;
      }

      .drop-common {
        background: linear-gradient(0deg, #89c0db, #0000);
        border: 2px solid #89c0db;
      }
      .drop-uncommon {
        background: linear-gradient(0deg, #009ae2, #0000);
        border: 2px solid #89c0db;
      }
      .drop-milspec {
        background: linear-gradient(0deg, #006ae2, #0000);
        border: 2px solid #89c0db;
      }
      .drop-restricted {
        background: linear-gradient(0deg, #8000e2, #0000);
        border: 2px solid #d8a8fd;
      }
      .drop-classified {
        background: linear-gradient(0deg, #e200a0, #0000);
        border: 2px solid #f879d2;
      }
      .drop-covert {
        background: linear-gradient(0deg, #e23000, #0000);
        border: 2px solid #e23000;
      }
      .drop-rare {
        background: linear-gradient(0deg, #ffc600, #0000);
        border: 2px solid #ffc600;
      }

      .drop .top-area {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
      }

      .drop .user-area {
        display: flex;
        gap: 8px;
      }

      .drop .user-area .logo img {
        width: 30px;
        border-radius: 6px;
      }

      .drop .user-area .name {
        max-width: 100px;
        font-size: 15px;
        font-weight: 700;
      }

      .drop .top-area .multiplier {
        font-size: 20px;
        font-weight: 900;
        text-align: right;
      }

      .drop .top-area .provably {
        font-size: 12px;
        color: #ffffff77;
        text-align: right;
      }

      .divider {
        width: 90%;
        margin: 6px auto;
        height: 2px;
        background-color: #ffffff33;
      }

      .vertical-divider {
        width: 2px;
        height: 120px;
        background-color: #ffffff33;
      }

      .skins-section {
        display: flex;
        justify-content: space-evenly;
        align-items: center;
      }

      .skins-section .name {
        color: #ffffffe0;
        font-size: 12px;
        font-weight: 700;
        margin: 6px 0;
        text-align: center;
      }

      .skins-section .price {
        font-weight: 900;
        font-size: 16px;
        text-align: center;
      }

      .upgrade {
        width: 50%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        text-align: center;
      }

      .upgrade-grid {
        --ug-gap: 8px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: center;
        gap: var(--ug-gap);
      }

      .upgrade-grid > .upgrade-item:last-child:nth-child(odd) {
        grid-column: 1 / -1;
        justify-self: center;
        width: calc((100% - var(--ug-gap)) / 2);
      }

      .upgrade .balance {
        font-weight: 900;
        font-size: 16px;
        text-align: center;
      }

      .upgrade .logo {
        width: 130px;
        height: 74px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
      }

      .upgrade .logo-balance {
        height: 64px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        margin-top: 10px;
      }

      .upgrade .logo-grid {
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
      }

      .case {
        width: 50%;
        display: flex;
        flex-direction: column;
        justify-content: start;
      }
      .case .logo {
        height: 74px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
      }

      .received {
        width: 50%;
      }

      .received .logo {
        height: 74px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
      }

      .balance-absolute {
        font-weight: 800;
        font-size: 15px;
        margin-left: 8px;
        text-align: center;
      }

      /* ?overlay — fundo transparente (OBS) e logo do canal oculta (#streammer-logo) */
      html.overlay,
      html.overlay body {
        background: transparent !important;
      }
      html.overlay .live-drop {
        background-color: transparent !important;
      }
      html.overlay #streammer-logo {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="live-drop">
      <div class="streammer" id="streammer-logo" style="display: none">
        <a id="streamer-link" href="#" target="_blank">
          <img
          id="streamer-logo"
            src="#"
            alt=""
            class="logo"
          />
        </a>
      </div>
      <script>
        (function () {
          var params = new URLSearchParams(window.location.search);
          if (!params.has("hide-logo")) {
            document.getElementById("streammer-logo").style.display = "";
          }
        })();
      </script>
      <script>

    const streamers = [
      {
        name: 'saullo',
        url: 'https://canaldosaullo.com.br',
        image: 'https://yt3.googleusercontent.com/ytc/AIdro_lNaHfvTMuvlTWYNNUJMGM0WW90HZ6xZHV56AS-MnvnQ8oJ=s176-c-k-c0x00ffffff-no-rj-mo'
      },
      {
        name: 'bancarios',
        url: 'https://leodobancarios.com/',
        image: 'https://yt3.googleusercontent.com/mwJj5e3TotDahbp1SklXSWXrmJZZvGDDWivBUgTaNtxVPxxc3CGlkk3gdjjbXhxt1uuDWvB1=s160-c-k-c0x00ffffff-no-rj'
      
      },
      {
        name: 'fasconcelos',
        url: 'https://www.youtube.com/@fasconcelos4',
        image: 'https://yt3.googleusercontent.com/l9TS4OpI2SWnbX2qUK2d-Gud24gQXk4dLFie6dPd3omSij498RgiE_wHxm0JPw4TvAMHrMp2fw=s160-c-k-c0x00ffffff-no-rj'
      },
      {
        name: "ninja",
        url: 'https://www.youtube.com/@NINJAYTB',
        image: 'https://yt3.googleusercontent.com/ytc/AIdro_kasq9mZks-MVUpJtlgBJsBDOIE_6KDGdUz-Xu1e3BCJSo=s176-c-k-c0x00ffffff-no-rj-mo'
      },
      {
        name: "fogoleo",
        url: 'https://www.youtube.com/@FogoleoTV',
        image: 'https://yt3.googleusercontent.com/CrTlRoWtkaxBVBDh0cR9jvvJyNd-BPgVdGmQRfUANHbpF73SsC5TPUfWTHHZzveZ8S57a-PVEg=s160-c-k-c0x00ffffff-no-rj'
      },
      {
        name: "rk",
        url: 'https://www.youtube.com/@RKSQUADCS',
        image: 'https://yt3.googleusercontent.com/Hp6T7KJFGaJoboo7tbkLwwaRp0KP008h2XoGbu7hvS0W68w8GtYpq0aqGgKO51Bhax9lrSvg=s160-c-k-c0x00ffffff-no-rj'
      },
      {
        name: "maykfps",
        url: 'https://www.youtube.com/@MAYKFPSS',
        image: 'https://yt3.googleusercontent.com/sr6VsNKESD3XK4BAGaMU7QuAdRrfKVDBJZUtYa4EAYfc3R-XSsMXnui_9teym8M54t4KU_ZQ9Zs=s160-c-k-c0x00ffffff-no-rj'
      },
    ]
    function setStreamerInfo() {
      var params = new URLSearchParams(window.location.search);
      const streamer = params.get("streamer");
      if (streamer) {
        const streamerInfo = streamers.find(s => s.name === streamer);
        if (streamerInfo) {
          document.getElementById("streamer-link").href = streamerInfo.url;
          document.getElementById("streamer-logo").src = streamerInfo.image;
        }
      }
    }

    setStreamerInfo();
      </script>
      <div class="drops-area" id="drops-area"></div>
      <script>
        (function () {
          var p = new URLSearchParams(window.location.search);
          var el = document.getElementById("drops-area");
          if (el && p.has("hide-background")) el.classList.add("hide-background");
        })();
      </script>
    </div>

    <script>
      (function () {
        var dropsArea = document.querySelector(".drops-area");
        var MAX_ITEMS = 20;

        function renderDrop(drop) {
          let dropHTML = "";
          let rarityClass = "";

          // Determinar a classe de raridade para o drop
          if (drop.type === "case" && drop.drop && drop.drop.rarity) {
            rarityClass = `drop-${drop.drop.rarity.toLowerCase()}`;
          } else if (
            drop.type === "upgrade" &&
            drop.receivedSkinsFormatted &&
            drop.receivedSkinsFormatted.rarity
          ) {
            rarityClass = `drop-${drop.receivedSkinsFormatted.rarity.toLowerCase()}`;
          }

          if (drop.type === "case") {
            dropHTML = `
              <div class="drop ${rarityClass}">
                <div class="top-area">
                  <div class="user-area">
                    <a href="${"https://csgo.net/user/" + drop.userId}" target="_blank">
                    <div class="logo">
                        <img src="${drop.userImage}" alt="" />
                    </div>
                    <div class="name">${drop.userName}</div>
                    </a>
                  </div>
                  <div class="multiplier">${(
                    drop.drop.price / drop.case.price
                  ).toFixed(2)}x  <br /> <div class="provably">${
              drop.rollNumber
            }</div></div>
                </div>
                <div class="divider"></div>
                <div class="skins-section">
                  <div class="case">
                    <div class="logo" style="background-image: url('${
                      drop.case.image
                    }');"></div>
                    <div class="name">${drop.case.name.toUpperCase()}</div>
                    <div class="price">$ ${drop.case.price.toFixed(2)}</div>
                  </div>
                  <div class="vertical-divider"></div>
                  <div class="received">
                    <div class="logo" style="background-image: url('${
                      drop.drop.image
                    }');"></div>
                    <div class="name">${drop.drop.name}</div>
                    <div class="price">$ ${drop.drop.price.toFixed(2)}</div>
                  </div>
                </div>
              </div>
            `;
          } else if (drop.type === "upgrade") {
            if (drop.usedSkinsFormatted.length === 0) {
              dropHTML = `
                <div class="drop ${rarityClass}">
                  <div class="top-area">
                    <div class="user-area">
                         <a href="${"https://csgo.net/user/" + drop.userId}" target="_blank">
                      <div class="logo">
                          <img src="${drop.userImage}" alt="" />
                          </div>
                          <div class="name">${drop.userName}</div>
                          </a>
                    </div>
                    <div class="multiplier">${
                      drop.chance
                    } <br /> <div class="provably">${
                drop.rollNumber ?? ""
              }</div></div>
                  </div>
                  <div class="divider"></div>
                  <div class="skins-section">
                    <div class="upgrade">
                      <div class="upgrade-item">
                        <div class="logo-balance" style="background-image: url('https://csgo.net/public/img/other/upgrade/balance.png?v=5');"></div>
                        <div class="name">Balance</div>
                      </div>
                      <span class="balance">$ ${parseFloat(
                        drop.firstValue
                      ).toFixed(2)}</span>
                    </div>
                    <div class="vertical-divider"></div>
                    <div class="received">
                      <div class="logo" style="background-image: url('${
                        drop.receivedSkinsFormatted.image
                      }');"></div>
                      <div class="name">${drop.receivedSkinsFormatted.type} - ${
                drop.receivedSkinsFormatted.name
              }</div>
                      <div class="price">$ ${parseFloat(
                        drop.receivedBalance
                      ).toFixed(2)}</div>
                    </div>
                  </div>
                </div>
              `;
            } else if (drop.usedSkinsFormatted.length === 1) {
              const usedSkin = drop.usedSkinsFormatted[0];
              dropHTML = `
                <div class="drop ${rarityClass}">
                  <div class="top-area">
                    <div class="user-area">
                         <a href="${"https://csgo.net/user/" + drop.userId}" target="_blank">
                      <div class="logo">
                          <img src="${drop.userImage}" alt="" />
                          </div>
                          <div class="name">${drop.userName}</div>
                          </a>
                    </div>
                    <div class="multiplier">${
                      drop.chance
                    } <br /> <div class="provably">${
                drop.rollNumber ?? ""
              }</div></div>
                  </div>
                  <div class="divider"></div>
                  <div class="skins-section">
                    <div class="upgrade">
                      <div class="upgrade-item">
                        <div class="logo" style="background-image: url('${
                          usedSkin.image
                        }');"></div>
                        <div class="name">${usedSkin.type} - ${
                usedSkin.name
              }</div>
                      </div>
                      
                    <div class="balance-absolute">$ ${parseFloat(
                      drop.firstValue
                    ).toFixed(2)} ${
                drop.secondValue && parseFloat(drop.secondValue) > 0
                  ? "+ Balance $ " + parseFloat(drop.secondValue).toFixed(2)
                  : ""
              }</div>
                    </div>
                    <div class="vertical-divider"></div>
                    <div class="received">
                      <div class="logo" style="background-image: url('${
                        drop.receivedSkinsFormatted.image
                      }');"></div>
                      <div class="name">${drop.receivedSkinsFormatted.type} - ${
                drop.receivedSkinsFormatted.name
              }</div>
                      <div class="price">$ ${parseFloat(
                        drop.receivedBalance
                      ).toFixed(2)}</div>
                    </div>
                  </div>

                </div>
              `;
            } else if (drop.usedSkinsFormatted.length > 1) {
              const usedSkinsGrid = drop.usedSkinsFormatted
                .map(
                  (skin) => `
                    <div class="upgrade-item">
                      <div class="logo-grid" style="background-image: url('${skin.image}'); width: 80px; height: 50px;"></div>
                    </div>
                  `
                )
                .join("");

              dropHTML = `
                <div class="drop ${rarityClass}">
                  <div class="top-area">
                    <div class="user-area">
                        <a href="${"https://csgo.net/user/" + drop.userId}" target="_blank">
                      <div class="logo">
                          <img src="${drop.userImage}" alt="" />
                          </div>
                          <div class="name">${drop.userName}</div>
                          </a>
                    </div>
                    <div class="multiplier">${
                      drop.chance
                    }<br /> <div class="provably">${
                drop.rollNumber ?? ""
              }</div></div>
                  </div>
                  <div class="divider"></div>
                  <div class="skins-section">
                    <div class="upgrade">
                      <div class="upgrade-grid">
                          ${usedSkinsGrid}
                      </div>
                      <div class="balance-absolute"> $ ${parseFloat(
                        drop.firstValue
                      ).toFixed(2)} ${
                drop.secondValue && parseFloat(drop.secondValue) > 0
                  ? "+ Balance $ " + parseFloat(drop.secondValue).toFixed(2)
                  : ""
              }</div>
                    </div>
                    <div class="vertical-divider"></div>
                    <div class="received">
                      <div class="logo" style="background-image: url('${
                        drop.receivedSkinsFormatted.image
                      }');"></div>
                      <div class="name">${drop.receivedSkinsFormatted.type} - ${
                drop.receivedSkinsFormatted.name
              }</div>
                      <div class="price">$ ${parseFloat(
                        drop.receivedBalance
                      ).toFixed(2)}</div>
                    </div>
                  </div>
                </div>
              `;
            }
          }

          const newDropElement = document.createElement("div");
          newDropElement.innerHTML = dropHTML.trim();
          dropsArea.prepend(newDropElement.firstChild);

          // Remove o último item se exceder MAX_ITEMS
          while (dropsArea.children.length > MAX_ITEMS) {
            dropsArea.removeChild(dropsArea.lastElementChild);
          }
        }

        // Obter streamer da query string
        var params = new URLSearchParams(window.location.search);
        var streamer = params.get("streamer") || "";

        // 1) bootstrap: pegar os 20 últimos já processados
        var fetchUrl = "/api/fetched-rolls?limit=" + MAX_ITEMS;
        if (streamer) {
          fetchUrl += "&streamer=" + encodeURIComponent(streamer);
        }
        fetch(fetchUrl)
          .then(function (r) {
            return r.json();
          })
          .then(function (j) {
            // A API já retorna ordenado por created_at DESC
            // Renderiza na ordem inversa para que os mais recentes fiquem no topo
            (j.items || []).reverse().forEach(function (row) {
              let dropData;
              try {
                dropData = JSON.parse(row.data);
              } catch (e) {
                dropData = row.data;
              }
              // user_id da coluna do banco é a fonte autoritativa
              if (row.user_id) dropData = Object.assign({}, dropData, { userId: row.user_id });
              renderDrop(dropData);
            });
          })
          .catch(function (e) {
            console.error("[viewer] fetch error", e);
          });

        // 2) WebSocket com reconexão automática
        var proto = location.protocol === "https:" ? "wss" : "ws";
        var WS_URL = proto + "://" + location.host + "/ws";

        var ws = null;
        var reconnectTimer = null;
        var reconnectAttempts = 0;
        var HEARTBEAT_MS = 25_000; // envia ping a cada 25s
        var STALE_MS = 60_000; // se ficar sem tráfego por 60s, reinicia
        var heartbeatTimer = null;
        var lastActivityAt = Date.now();
        var closingExplicitly = false;

        function clearHeartbeat() {
          if (heartbeatTimer) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
          }
        }

        function startHeartbeat() {
          clearHeartbeat();
          heartbeatTimer = setInterval(function () {
            var now = Date.now();
            // Se está "stale" (sem tráfego há muito tempo), força reabrir
            if (now - lastActivityAt > STALE_MS) {
              console.warn("[viewer] ws stale, forcing reopen");
              try {
                ws && ws.close();
              } catch (_) {}
              return;
            }
            // Tenta enviar um ping (servidor pode ignorar, é só para manter tráfego)
            try {
              ws && ws.readyState === 1 && ws.send("ping");
            } catch (_) {}
          }, HEARTBEAT_MS);
        }

        function nextBackoffDelay() {
          var MAX = 30_000; // 30s
          var base = Math.min(Math.pow(2, reconnectAttempts) * 1_000, MAX);
          var jitter = Math.floor(Math.random() * 300); // até +300ms
          return base + jitter;
        }

        function scheduleReconnect() {
          if (closingExplicitly) return; // não reconecta em navegação/fechamento de página
          if (reconnectTimer) return; // já agendado
          var delay = nextBackoffDelay();
          console.log(
            "[viewer] scheduling reconnect in",
            delay,
            "ms (attempt",
            reconnectAttempts + 1,
            ")"
          );
          reconnectTimer = setTimeout(function () {
            reconnectTimer = null;
            reconnectAttempts++;
            connect();
          }, delay);
        }

        function connect() {
          try {
            ws = new WebSocket(WS_URL);
          } catch (e) {
            console.error("[viewer] ws ctor error", e);
            scheduleReconnect();
            return;
          }

          ws.onopen = function () {
            console.log("[viewer] ws open");
            reconnectAttempts = 0;
            lastActivityAt = Date.now();
            startHeartbeat();
          };

          ws.onmessage = function (ev) {
            lastActivityAt = Date.now();
            try {
              var msg = JSON.parse(ev.data);
              if (
                msg &&
                msg.event === "fetched_roll" &&
                msg.payload &&
                msg.payload.data
              ) {
                // Filtrar por streamer se especificado
                if (!streamer || msg.payload.streamer === streamer) {
                  // payload.userId é a fonte autoritativa; sobrescreve o userId dentro do JSON do drop
                  var dropData = msg.payload.userId
                    ? Object.assign({}, msg.payload.data, { userId: msg.payload.userId })
                    : msg.payload.data;
                  renderDrop(dropData);
                }
              }
            } catch (e) {
              // pode ser "pong" ou outro payload simples; log apenas erros reais
              if (ev && typeof ev.data === "string" && ev.data !== "pong") {
                console.error("[viewer] ws message error", e);
              }
            }
          };

          ws.onclose = function (ev) {
            clearHeartbeat();
            console.log("[viewer] ws closed", ev && ev.code, ev && ev.reason);
            // Fecha e tenta reconectar (a menos que tenha sido fechamento explícito)
            scheduleReconnect();
          };

          ws.onerror = function (e) {
            console.log("[viewer] ws error", e);
            // Fecha para cair no onclose e acionar o backoff
            try {
              ws && ws.close();
            } catch (_) {}
          };
        }

        // Reconecta imediatamente quando voltar o link
        window.addEventListener("online", function () {
          if (closingExplicitly) return;
          if (!ws || ws.readyState !== 1) {
            if (reconnectTimer) {
              clearTimeout(reconnectTimer);
              reconnectTimer = null;
            }
            reconnectAttempts = 0;
            connect();
          }
        });

        // Evita reconectar ao sair da página
        window.addEventListener("beforeunload", function () {
          closingExplicitly = true;
          clearHeartbeat();
          try {
            ws && ws.close();
          } catch (_) {}
        });

        // Boot
        connect();
      })();
    </script>
  </body>
</html>
